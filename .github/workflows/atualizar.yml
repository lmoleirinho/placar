name: Actualizar Placar

on:
  schedule:
    - cron: "0 8 * * 2,5"   # terças e sextas, 08:00 UTC
  workflow_dispatch: {}      # botão para correr à mão

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correr o actualizador (resultados + Benfica)
        run: python atualizar_placar.py index.html --benfica

      - name: Guardar alterações
        run: |
          git config user.name "placar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Actualização automática dos resultados"
          git push
